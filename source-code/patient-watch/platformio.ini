; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Conservative USB transfer speed for the physical main sensor.
upload_speed = 115200
; Main sensor uses saved Wi-Fi and a protected phone setup portal.
build_src_filter = +<main.cpp> +<camera_verifier.cpp> +<wifi_provisioning.cpp>
lib_ldf_mode = deep+
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit MPU6050
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	tzapu/WiFiManager@2.0.17

[env:esp32hardware]
extends = env:esp32dev
upload_port = COM3
monitor_port = COM3

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
; Safe first bring-up: snapshots remain enabled; white flash LED stays OFF.
; Do not enable direct public uploads without certificate-validated HTTPS.
build_flags = -DCAMERA_DIRECT_UPLOAD_ENABLED=0 -DCAMERA_FLASH_ENABLED=0
build_src_filter = +<esp32cam_node.cpp>
upload_port = COM5
monitor_port = COM5
upload_speed = 115200
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32cam_diagnostic]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter = +<esp32cam_diagnostic.cpp>
upload_port = COM5
monitor_port = COM5
upload_speed = 115200
monitor_speed = 115200
