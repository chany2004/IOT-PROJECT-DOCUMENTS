services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_monitoring
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d patient_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/patient_monitoring
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-480}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminDemo123!}
      SEED_CAREGIVER_PASSWORD: ${SEED_CAREGIVER_PASSWORD:-CareDemo123!}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.bootstrap && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
